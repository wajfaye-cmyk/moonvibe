name: Build Moonvibe

# Builds the Windows installer. The client mod for all 17 Minecraft versions is already in
# launcher/client-mods/, so this takes only a few minutes. Tick "Rebuild the mod" after changing
# mod/ or mod-legacy/ - the fresh jars are then used for the installer and attached to the run.
on:
  workflow_dispatch:
    inputs:
      rebuild_mod:
        description: Rebuild the mod from source (slow, only needed after changing mod/ or mod-legacy/)
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        if: ${{ inputs.rebuild_mod }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        if: ${{ inputs.rebuild_mod }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mod/**/*.gradle', 'mod-legacy/**/*.gradle', 'mod/versions/*', 'mod-legacy/versions/*') }}

      - name: Build mod (1.14.4 - 26.3)
        if: ${{ inputs.rebuild_mod }}
        shell: bash
        working-directory: mod
        run: |
          for f in versions/*.properties; do
            v=$(basename "$f" .properties)
            echo "::group::Minecraft $v"
            ./gradlew build -Pmc="$v" --no-daemon
            echo "::endgroup::"
          done

      - name: Build mod-legacy (1.8.9 - 1.13.2)
        if: ${{ inputs.rebuild_mod }}
        shell: bash
        working-directory: mod-legacy
        run: |
          for f in versions/*.properties; do
            v=$(basename "$f" .properties)
            echo "::group::Minecraft $v"
            ./gradlew build -Pmc="$v" --no-daemon
            echo "::endgroup::"
          done

      - name: Check bundled client mods
        shell: bash
        run: |
          count=$(ls launcher/client-mods/*/*.jar | wc -l)
          echo "Client mods: $count versions"
          test "$count" -ge 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build installer
        working-directory: launcher
        run: |
          npm ci
          npm run dist -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Moonvibe-Setup
          path: launcher/release/*.exe

      - name: Upload client mods
        if: ${{ inputs.rebuild_mod }}
        uses: actions/upload-artifact@v4
        with:
          name: Moonvibe-client-mods
          path: launcher/client-mods/
