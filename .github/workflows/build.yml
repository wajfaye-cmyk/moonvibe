name: Build Moonvibe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mod/**/*.gradle', 'mod-legacy/**/*.gradle', 'mod/versions/*', 'mod-legacy/versions/*') }}

      - name: Build mod (1.14.4 - 26.3)
        shell: bash
        working-directory: mod
        run: |
          for f in versions/*.properties; do
            v=$(basename "$f" .properties)
            echo "::group::Minecraft $v"
            ./gradlew build -Pmc="$v" --no-daemon
            echo "::endgroup::"
          done

      - name: Build mod-legacy (1.8.9 - 1.13.2)
        shell: bash
        working-directory: mod-legacy
        run: |
          for f in versions/*.properties; do
            v=$(basename "$f" .properties)
            echo "::group::Minecraft $v"
            ./gradlew build -Pmc="$v" --no-daemon
            echo "::endgroup::"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build installer
        working-directory: launcher
        run: |
          npm ci
          npm run dist -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Moonvibe-Setup
          path: launcher/release/*.exe

      - name: Upload client mods
        uses: actions/upload-artifact@v4
        with:
          name: Moonvibe-client-mods
          path: launcher/client-mods/
